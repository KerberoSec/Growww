static_resources:
  listeners:
  - name: growww_gateway_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: sovereign_exchange
              domains: ["*"]
              routes:
              - match: { prefix: "/api/v1/orders" }
                route: { cluster: order_service }
              - match: { prefix: "/api/v1/market" }
                route: { cluster: market_data_service }
              - match: { prefix: "/api/v1/compliance" }
                route: { cluster: compliance_service }
              - match: { prefix: "/api/v1/portfolio" }
                route: { cluster: portfolio_service }
  clusters:
  - name: order_service
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: order_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 9001 }
