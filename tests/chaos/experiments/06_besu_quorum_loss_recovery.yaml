apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: besu-quorum-loss-partition
  namespace: growww-blockchain
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: besu-qbft-consensus
spec:
  action: partition
  mode: fixed
  value: "2"
  selector:
    namespaces:
      - growww-blockchain
    labelSelectors:
      app.kubernetes.io/name: "besu-validator"
  direction: both
  duration: "2m"
