apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: matching-engine-pod-kill
  namespace: growww-trading
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: matching-engine
spec:
  action: pod-kill
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - growww-trading
    labelSelectors:
      app.kubernetes.io/name: "order-matching-engine"
  duration: "30s"
  scheduler:
    cron: "0 3 * * 2" # Weekly automated disaster drill
