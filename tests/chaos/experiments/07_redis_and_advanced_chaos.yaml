apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: redis-master-failover
  namespace: growww-core
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: redis-cluster
spec:
  action: pod-kill
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - growww-core
    labelSelectors:
      app.kubernetes.io/name: "redis"
      role: "master"
  duration: "30s"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: matching-engine-cpu-burn
  namespace: growww-trading
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: matching-engine
spec:
  mode: one
  selector:
    namespaces:
      - growww-trading
    labelSelectors:
      app.kubernetes.io/name: "order-matching-engine"
  stressors:
    cpu:
      workers: 4
      load: 85
  duration: "45s"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: settlement-io-delay
  namespace: growww-settlement
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: settlement-storage
spec:
  action: latency
  mode: all
  selector:
    namespaces:
      - growww-settlement
    labelSelectors:
      app.kubernetes.io/name: "trade-settlement-service"
  volumePath: /data
  delay: "100ms"
  duration: "1m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: gateway-dns-degradation
  namespace: growww-core
  labels:
    app.kubernetes.io/component: chaos-test
    chaos.growww.in/target: core-dns
spec:
  action: error
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - growww-core
    labelSelectors:
      app.kubernetes.io/name: "api-gateway"
  patterns:
    - "*.growww-settlement.svc.cluster.local"
  duration: "30s"
