version: "3.8"

services:
  validator1:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator1
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./config.toml:/opt/besu/config.toml:ro
      - validator1-data:/opt/besu/data
    command:
      - --config-file=/opt/besu/config.toml
      - --node-private-key-file=/opt/besu/data/key
    ports:
      - "8545:8545"
      - "8546:8546"
      - "9545:9545"
    networks:
      besu-net:
        ipv4_address: 172.25.0.2

  validator2:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator2
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./config.toml:/opt/besu/config.toml:ro
      - validator2-data:/opt/besu/data
    command:
      - --config-file=/opt/besu/config.toml
      - --bootnodes=enode://fe3b557e8fb62b89f4916b721be55ceb828dbd73@172.25.0.2:30303
    networks:
      besu-net:
        ipv4_address: 172.25.0.3

  validator3:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator3
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./config.toml:/opt/besu/config.toml:ro
      - validator3-data:/opt/besu/data
    command:
      - --config-file=/opt/besu/config.toml
      - --bootnodes=enode://fe3b557e8fb62b89f4916b721be55ceb828dbd73@172.25.0.2:30303
    networks:
      besu-net:
        ipv4_address: 172.25.0.4

  validator4:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator4
    volumes:
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./config.toml:/opt/besu/config.toml:ro
      - validator4-data:/opt/besu/data
    command:
      - --config-file=/opt/besu/config.toml
      - --bootnodes=enode://fe3b557e8fb62b89f4916b721be55ceb828dbd73@172.25.0.2:30303
    networks:
      besu-net:
        ipv4_address: 172.25.0.5

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:

networks:
  besu-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
