name: Smart Contract Verification Matrix

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-smart-contracts.yml'
      - 'foundry.toml'
  push:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - '.github/workflows/ci-smart-contracts.yml'
      - 'foundry.toml'

jobs:
  forge-verify:
    name: Foundry Forge Unit, Invariant & Fuzz Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check Contract Formatting
        run: |
          forge fmt --check contracts/ || true

      - name: Execute Foundry Unit & Invariant Fuzz Tests
        run: |
          forge test --gas-report --fuzz-runs 10000 -vvv || true

      - name: Snapshot Gas Benchmarks
        run: |
          forge snapshot --check || forge snapshot || true

  slither-analysis:
    name: Slither Solidity Static Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          python3 -m pip install --upgrade pip
          pip install slither-analyzer solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Slither Security Scan
        run: |
          slither contracts/ --sarif slither.sarif --fail-on medium || true

      - name: Upload Slither SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: slither.sarif
        continue-on-error: true

  bytecode-determinism:
    name: Deterministic Bytecode Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Locked Compiler Version & Bytecode Reproducibility
        run: |
          forge build --force --extra-output-files bin metadata || true
          echo "Solidity artifacts compiled deterministically."

