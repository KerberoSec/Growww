name: Container Build, Scan, SBOM & Cosign Signing

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-scan-sign:
    name: Build Multi-Arch Container, Scan & Sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: services/api-gateway
            dockerfile: Dockerfile
          - name: matching-engine
            context: services/order-matching-engine
            dockerfile: Dockerfile
          - name: trade-settlement-service
            context: services/trade-settlement-service
            dockerfile: Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/growww/${{ matrix.service.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Container Image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/growww/${{ matrix.service.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Scan Results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Generate Software Bill of Materials (SBOM) with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/growww/${{ matrix.service.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.service.name }}-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Sign Container Artifact with Keyless OIDC
        if: github.event_name != 'pull_request' && false # Set to true when pushed to registry
        run: |
          echo "Cosign signing image via OIDC: ghcr.io/growww/${{ matrix.service.name }}:${{ github.sha }}"
