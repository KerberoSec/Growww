name: specification-integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-specifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Architecture & Invariants
        run: |
          python3 -c '
          import os

          root = "."

          # Verify no unicode em-dash or en-dash characters in markdown spec files
          # (spec docs must use ASCII hyphens only for cross-platform tooling compatibility)
          dashes = []
          for dp, dn, fn in os.walk(root):
              if ".git" in dp: continue
              for f in fn:
                  if f.endswith(".md"):
                      p = os.path.join(dp, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          c = fp.read()
                          if "\u2014" in c or "\u2013" in c:
                              dashes.append(p)
          assert len(dashes) == 0, f"Found unicode dashes in: {dashes}"
          print("All specifications verified clean!")
          '
