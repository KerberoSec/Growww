performance_specification:
  version: "1.0.0"
  market_hours_uptime_sla_percent: 99.99
  general_uptime_sla_percent: 99.90
  disaster_recovery:
    rto_minutes: 15
    rpo_seconds_database: 1
    rpo_seconds_ledger: 0

  latency_budgets_ms:
    order_matching_engine:
      p50: 1.0
      p95: 2.5
      p99: 5.0
    api_gateway_bff:
      p50: 15.0
      p95: 35.0
      p99: 50.0
    settlement_engine_dvp:
      p50: 500.0
      p95: 1500.0
      p99: 2000.0
    client_flutter_cold_start:
      p99: 1500.0

  throughput_targets_rps:
    order_submission_burst: 10000
    order_matching_sustained: 2500
    besu_ledger_dvp_settlement: 1500
    websocket_active_connections: 1000000

  storage_durability:
    audit_log_retention_years: 7
    database_backup_frequency_hours: 1
    point_in_time_recovery_days: 35

# Extended Operational Subsystem SLOs & Performance Matrices
microservice_slos:
  order_service:
    protocol: "grpc"
    latency_ms:
      p50: 5.0
      p95: 15.0
      p99: 25.0
      p99_9: 40.0
    availability_sla_percent: 99.99
    timeout_ms: 100
    circuit_breaker:
      failure_rate_threshold_percent: 50
      slow_call_rate_threshold_percent: 60
      slow_call_duration_threshold_ms: 50
      wait_duration_in_open_state_ms: 5000
      permitted_calls_in_half_open_state: 20

  pre_trade_risk_engine:
    protocol: "in_memory_ipc"
    latency_ms:
      p50: 0.2
      p95: 0.8
      p99: 1.5
      p99_9: 3.0
    availability_sla_percent: 99.999
    timeout_ms: 10
    circuit_breaker:
      failure_rate_threshold_percent: 25
      wait_duration_in_open_state_ms: 1000

  matching_engine_core:
    protocol: "lock_free_spsc_ring"
    latency_ms:
      p50: 0.010
      p95: 0.050
      p99: 0.100
      p99_9: 0.500
    availability_sla_percent: 99.999
    timeout_ms: 5

  user_and_auth_service:
    protocol: "grpc"
    latency_ms:
      p50: 10.0
      p95: 25.0
      p99: 50.0
      p99_9: 80.0
    availability_sla_percent: 99.95
    timeout_ms: 200

  market_data_gateway:
    protocol: "websocket_binary"
    conflation_window_ms: 100
    latency_ms:
      p50: 5.0
      p95: 20.0
      p99: 50.0
      p99_9: 100.0
    availability_sla_percent: 99.99
    timeout_ms: 150

  settlement_and_clearing_engine:
    protocol: "grpc_and_evm_rpc"
    latency_ms:
      p50: 250.0
      p95: 1000.0
      p99: 1800.0
      p99_9: 2500.0
    availability_sla_percent: 99.99
    timeout_ms: 5000

  depository_and_banking_gateway:
    protocol: "iso20022_and_rest"
    latency_ms:
      p50: 200.0
      p95: 800.0
      p99: 1500.0
      p99_9: 3000.0
    availability_sla_percent: 99.90
    timeout_ms: 10000

