blockchain_invariants_besu_qbft:
  consensus_protocol: "QBFT"
  block_time_seconds: 2.0
  deterministic_finality_blocks: 1
  probabilistic_fork_tolerance: 0
  active_validators_count: 4
  byzantine_fault_tolerance_f: 1
  min_quorum_validators: 3
  settlement_throughput_tps_min: 1500
  storage_engine: "Bonsai_Trie_RocksDB"
  max_hot_working_state_gb: 450
  rolling_trie_pruning_depth_blocks: 2048
  account_abstraction_relayers_shards: 32
  gas_sponsorship_mode: "100_percent_paymaster"
  zero_pii_onchain: true
  compact_hash_payload_bytes: 32

