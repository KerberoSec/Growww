    type: "API"
    severity_max: "CRITICAL"
    eligible_for_bounty: true
  - asset: "app.growww.in"
    type: "WEB"
    severity_max: "CRITICAL"
    eligible_for_bounty: true
  - asset: "Growww Flutter Mobile App (Android/iOS)"
    type: "MOBILE"
    severity_max: "CRITICAL"
    eligible_for_bounty: true
  - asset: "Growww Smart Contracts (Besu)"
    type: "SMART_CONTRACT"
    severity_max: "CRITICAL"
    eligible_for_bounty: true
