#
# Growww / NBSE Tuned Profile: Ultra-Low Latency Exchange
# Optimized for sub-microsecond in-memory matching engine, DPDK zero-copy bypass, and deterministic tick execution.
#

[main]
summary=Institutional exchange profile for sub-microsecond determinism and kernel bypass
include=latency-performance

[cpu]
governor=performance
energy_perf_bias=performance
min_perf_pct=100
force_latency=cstate.id:1|1

[bootloader]
cmdline=isolcpus=2-15 nohz_full=2-15 rcu_nocbs=2-15 irqaffinity=0,1 intel_idle.max_cstate=0 processor.max_cstate=0 idle=poll intel_pstate=performance transparent_hugepage=never tsc=reliable clocksource=tsc audit=0 nmi_watchdog=0 nosoftlockup iommu=pt

[sysctl]
# Kernel Task Scheduling & Determinism
kernel.sched_rt_runtime_us = -1
kernel.sched_migration_cost_ns = 5000000
kernel.hung_task_timeout_secs = 0
kernel.watchdog = 0
kernel.nmi_watchdog = 0
kernel.numa_balancing = 0
kernel.pid_max = 4194304

# Network Socket Optimization & Busy Polling
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.netdev_max_backlog = 250000
net.core.somaxconn = 65535
net.core.busy_read = 50
net.core.busy_poll = 50

# TCP Latency & Buffer Allocation
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_congestion_control = bbr
net.ipv4.ip_local_port_range = 10240 65535

# Virtual Memory, Hugepages & Dirty Ratio
vm.swappiness = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
vm.vfs_cache_pressure = 50
vm.compaction_proactiveness = 0
vm.nr_hugepages = 8192
vm.max_map_count = 262144

# File Descriptors
fs.file-max = 20971520
fs.nr_open = 20971520

[vm]
transparent_hugepages=never

[disk]
readahead=4096
