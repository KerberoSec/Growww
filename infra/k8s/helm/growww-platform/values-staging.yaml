global:
  environment: "staging"
  region: "ap-south-1"
  clusterDomain: "cluster.local"

apiGateway:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  hpa:
    minReplicas: 3
    maxReplicas: 10

matchingEngine:
  replicas: 2
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"

fixGateway:
  replicas: 2
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

settlementService:
  replicas: 2
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

ingress:
  enabled: true
  host: "staging-exchange.growww.in"
  apiHost: "staging-api.exchange.growww.in"
