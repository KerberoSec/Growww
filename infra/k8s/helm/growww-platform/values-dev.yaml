global:
  environment: "dev"
  region: "ap-south-1"
  clusterDomain: "cluster.local"

apiGateway:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  hpa:
    minReplicas: 2
    maxReplicas: 4

matchingEngine:
  replicas: 1
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

fixGateway:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

settlementService:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

ingress:
  enabled: true
  host: "dev-exchange.growww.in"
  apiHost: "dev-api.exchange.growww.in"
