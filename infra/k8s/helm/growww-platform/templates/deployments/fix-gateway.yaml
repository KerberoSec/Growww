apiVersion: apps/v1
kind: Deployment
metadata:
  name: fix-gateway
  namespace: growww-core
  labels:
    app.kubernetes.io/name: fix-gateway
    app.kubernetes.io/component: institutional-gateway
    app.kubernetes.io/part-of: growww-platform
spec:
  replicas: {{ .Values.fixGateway.replicas | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fix-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fix-gateway
        app.kubernetes.io/component: institutional-gateway
        app.kubernetes.io/part-of: growww-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9801"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: critical-trading
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - fix-gateway
              topologyKey: topology.kubernetes.io/zone
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-tier
                operator: In
                values:
                - memory-optimized
                - general-compute
      containers:
      - name: fix-gateway
        image: "{{ .Values.fixGateway.image.repository | default "ghcr.io/growww/fix-protocol-gateway" }}:{{ .Values.fixGateway.image.tag | default "latest" }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: fix-tcp
          containerPort: 9800
          protocol: TCP
        - name: metrics
          containerPort: 9801
          protocol: TCP
        env:
        - name: FIX_PORT
          value: "9800"
        - name: MATCHING_ENGINE_ADDR
          value: "order-matching-engine.growww-trading.svc.cluster.local:9001"
        resources:
          requests:
            cpu: {{ .Values.fixGateway.resources.requests.cpu | default "4000m" }}
            memory: {{ .Values.fixGateway.resources.requests.memory | default "8Gi" }}
          limits:
            cpu: {{ .Values.fixGateway.resources.limits.cpu | default "8000m" }}
            memory: {{ .Values.fixGateway.resources.limits.memory | default "16Gi" }}
        livenessProbe:
          tcpSocket:
            port: 9800
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9800
          initialDelaySeconds: 5
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fix-gateway
  namespace: growww-core
  labels:
    app.kubernetes.io/name: fix-gateway
spec:
  type: ClusterIP
  ports:
  - name: fix-tcp
    port: 9800
    targetPort: 9800
    protocol: TCP
  - name: metrics
    port: 9801
    targetPort: 9801
    protocol: TCP
  selector:
    app.kubernetes.io/name: fix-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fix-gateway-pdb
  namespace: growww-core
spec:
  minAvailable: 66%
  selector:
    matchLabels:
      app.kubernetes.io/name: fix-gateway
