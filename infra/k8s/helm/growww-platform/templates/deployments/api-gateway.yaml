apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: growww-core
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: ingress-gateway
    app.kubernetes.io/part-of: growww-platform
spec:
  replicas: {{ .Values.apiGateway.replicas | default 6 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: ingress-gateway
        app.kubernetes.io/part-of: growww-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: general-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - api-gateway
              topologyKey: topology.kubernetes.io/zone
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-tier
                operator: In
                values:
                - general-compute
      containers:
      - name: gateway
        image: "{{ .Values.apiGateway.image.repository | default "ghcr.io/growww/api-gateway" }}:{{ .Values.apiGateway.image.tag | default "latest" }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "production" | quote }}
        - name: MATCHING_ENGINE_URL
          value: "order-matching-engine.growww-trading.svc.cluster.local:9001"
        - name: RATELIMIT_SERVICE_URL
          value: "rate-limiting-service.growww-core.svc.cluster.local:8081"
        resources:
          requests:
            cpu: {{ .Values.apiGateway.resources.requests.cpu | default "2000m" }}
            memory: {{ .Values.apiGateway.resources.requests.memory | default "4Gi" }}
          limits:
            cpu: {{ .Values.apiGateway.resources.limits.cpu | default "4000m" }}
            memory: {{ .Values.apiGateway.resources.limits.memory | default "8Gi" }}
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: growww-core
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: growww-core
spec:
  minAvailable: 66%
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
