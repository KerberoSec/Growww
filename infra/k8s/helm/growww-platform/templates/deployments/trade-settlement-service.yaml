apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-settlement-service
  namespace: growww-settlement
  labels:
    app.kubernetes.io/name: trade-settlement-service
    app.kubernetes.io/component: settlement-orchestrator
    app.kubernetes.io/part-of: growww-platform
spec:
  replicas: {{ .Values.settlementService.replicas | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-settlement-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-settlement-service
        app.kubernetes.io/component: settlement-orchestrator
        app.kubernetes.io/part-of: growww-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: core-settlement
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - trade-settlement-service
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: settlement
        image: "{{ .Values.settlementService.image.repository | default "ghcr.io/growww/trade-settlement-service" }}:{{ .Values.settlementService.image.tag | default "latest" }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: grpc
          containerPort: 9002
          protocol: TCP
        env:
        - name: PORT
          value: "9002"
        - name: BESU_RPC_URL
          value: "http://besu-validator.growww-blockchain.svc.cluster.local:8545"
        - name: KAFKA_BOOTSTRAP
          value: "kafka.growww-core.svc.cluster.local:9092"
        resources:
          requests:
            cpu: {{ .Values.settlementService.resources.requests.cpu | default "2000m" }}
            memory: {{ .Values.settlementService.resources.requests.memory | default "4Gi" }}
          limits:
            cpu: {{ .Values.settlementService.resources.limits.cpu | default "4000m" }}
            memory: {{ .Values.settlementService.resources.limits.memory | default "8Gi" }}
        livenessProbe:
          tcpSocket:
            port: 9002
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9002
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trade-settlement-service
  namespace: growww-settlement
  labels:
    app.kubernetes.io/name: trade-settlement-service
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
    protocol: TCP
  selector:
    app.kubernetes.io/name: trade-settlement-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trade-settlement-service-pdb
  namespace: growww-settlement
spec:
  minAvailable: 66%
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-settlement-service
