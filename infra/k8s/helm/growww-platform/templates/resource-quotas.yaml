{{- $namespaces := list "growww-core" "growww-trading" "growww-settlement" "growww-gift-city" "growww-blockchain" "growww-secops" "growww-observability" -}}
{{- range $ns := $namespaces }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $ns }}-quota
  namespace: {{ $ns }}
spec:
  hard:
    requests.cpu: "128"
    requests.memory: "256Gi"
    limits.cpu: "256"
    limits.memory: "512Gi"
    pods: "100"
    services: "30"
    services.loadbalancers: "2"
    count/persistentvolumeclaims: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $ns }}-limit-range
  namespace: {{ $ns }}
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "2Gi"
    defaultRequest:
      cpu: "250m"
      memory: "512Mi"
    type: Container
    max:
      cpu: "32"
      memory: "64Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
{{- end }}
