---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trading-pipeline
  namespace: growww-trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-matching-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: growww-core
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api-gateway
    ports:
    - protocol: TCP
      port: 9001
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: growww-core
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5432
