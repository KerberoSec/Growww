apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-settlement-service
  namespace: growww-settlement
  labels:
    app.kubernetes.io/name: trade-settlement-service
    app.kubernetes.io/component: settlement-orchestrator
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-settlement-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-settlement-service
        app.kubernetes.io/component: settlement-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
    spec:
      priorityClassName: core-settlement
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - trade-settlement-service
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: settlement
        image: ghcr.io/growww/trade-settlement-service:1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: grpc
          containerPort: 9002
          protocol: TCP
        env:
        - name: PORT
          value: "9002"
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          tcpSocket:
            port: 9002
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9002
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trade-settlement-service
  namespace: growww-settlement
  labels:
    app.kubernetes.io/name: trade-settlement-service
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
    protocol: TCP
  selector:
    app.kubernetes.io/name: trade-settlement-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trade-settlement-service-pdb
  namespace: growww-settlement
spec:
  minAvailable: 66%
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-settlement-service
