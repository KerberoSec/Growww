apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-matching-engine
  namespace: growww-trading
  labels:
    app.kubernetes.io/name: order-matching-engine
    app.kubernetes.io/component: matching-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-matching-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-matching-engine
        app.kubernetes.io/component: matching-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
    spec:
      priorityClassName: critical-trading
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - cpu-trading
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - order-matching-engine
            topologyKey: topology.kubernetes.io/zone
      tolerations:
      - key: "trading-workload"
        operator: "Equal"
        value: "critical"
        effect: "NoSchedule"
      containers:
      - name: matching-engine
        image: ghcr.io/growww/order-matching-engine:1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        ports:
        - name: grpc
          containerPort: 9001
          protocol: TCP
        - name: metrics
          containerPort: 2112
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            cpu: 8000m
            memory: 16Gi
          limits:
            cpu: 16000m
            memory: 32Gi
        livenessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 2
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-matching-engine
  namespace: growww-trading
  labels:
    app.kubernetes.io/name: order-matching-engine
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 9001
    targetPort: 9001
    protocol: TCP
  - name: metrics
    port: 2112
    targetPort: 2112
    protocol: TCP
  selector:
    app.kubernetes.io/name: order-matching-engine
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-matching-engine-pdb
  namespace: growww-trading
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-matching-engine
