apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: growww-edge-ingress
  namespace: growww-core
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health/readiness
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.exchange.growww.in
    secretName: growww-edge-tls-cert
  rules:
  - host: api.exchange.growww.in
    http:
      paths:
      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /api/v1/settlement
        pathType: Prefix
        backend:
          service:
            name: trade-settlement-service
            port:
              number: 9002
      - path: /health/readiness
        pathType: Exact
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
