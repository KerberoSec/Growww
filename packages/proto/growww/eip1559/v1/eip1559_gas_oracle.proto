syntax = "proto3";

package growww.eip1559.v1;

option go_package = "growww/packages/proto/growww/eip1559/v1;eip1559v1";

message Eip1559gasoraclecalculationRequest {
  string request_id = 1;
  string entity_id = 2;
  uint64 amount_e8 = 3;
  uint64 timestamp_ms = 4;
  map<string, string> metadata = 5;
}

message Eip1559gasoraclecalculationResponse {
  string request_id = 1;
  bool success = 2;
  string transaction_hash = 3;
  uint64 block_number = 4;
  string error_message = 5;
}

service Eip1559gasoraclecalculationService {
  rpc Execute(Eip1559gasoraclecalculationRequest) returns (Eip1559gasoraclecalculationResponse);
}
