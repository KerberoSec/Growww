syntax = "proto3";

package growww.event.v1;

option go_package = "growww/packages/proto/growww/event/v1;eventv1";

message EventsourcingcqrsarchitectureRequest {
  string request_id = 1;
  string entity_id = 2;
  uint64 amount_e8 = 3;
  uint64 timestamp_ms = 4;
  map<string, string> metadata = 5;
}

message EventsourcingcqrsarchitectureResponse {
  string request_id = 1;
  bool success = 2;
  string transaction_hash = 3;
  uint64 block_number = 4;
  string error_message = 5;
}

service EventsourcingcqrsarchitectureService {
  rpc Execute(EventsourcingcqrsarchitectureRequest) returns (EventsourcingcqrsarchitectureResponse);
}
