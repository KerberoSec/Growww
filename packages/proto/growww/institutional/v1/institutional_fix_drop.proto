syntax = "proto3";

package growww.institutional.v1;

option go_package = "growww/packages/proto/growww/institutional/v1;institutionalv1";

message InstitutionalfixdropcopybroadcasterRequest {
  string request_id = 1;
  string entity_id = 2;
  uint64 amount_e8 = 3;
  uint64 timestamp_ms = 4;
  map<string, string> metadata = 5;
}

message InstitutionalfixdropcopybroadcasterResponse {
  string request_id = 1;
  bool success = 2;
  string transaction_hash = 3;
  uint64 block_number = 4;
  string error_message = 5;
}

service InstitutionalfixdropcopybroadcasterService {
  rpc Execute(InstitutionalfixdropcopybroadcasterRequest) returns (InstitutionalfixdropcopybroadcasterResponse);
}
