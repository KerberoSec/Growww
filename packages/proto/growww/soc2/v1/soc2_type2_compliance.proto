syntax = "proto3";

package growww.soc2.v1;

option go_package = "growww/packages/proto/growww/soc2/v1;soc2v1";

message Soc2type2compliancecontrolsRequest {
  string request_id = 1;
  string entity_id = 2;
  uint64 amount_e8 = 3;
  uint64 timestamp_ms = 4;
  map<string, string> metadata = 5;
}

message Soc2type2compliancecontrolsResponse {
  string request_id = 1;
  bool success = 2;
  string transaction_hash = 3;
  uint64 block_number = 4;
  string error_message = 5;
}

service Soc2type2compliancecontrolsService {
  rpc Execute(Soc2type2compliancecontrolsRequest) returns (Soc2type2compliancecontrolsResponse);
}
