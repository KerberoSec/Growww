syntax = "proto3";

package growww.iso27001.v1;

option go_package = "growww/packages/proto/growww/iso27001/v1;iso27001v1";

message Iso27001ismssecuritypolicyRequest {
  string request_id = 1;
  string entity_id = 2;
  uint64 amount_e8 = 3;
  uint64 timestamp_ms = 4;
  map<string, string> metadata = 5;
}

message Iso27001ismssecuritypolicyResponse {
  string request_id = 1;
  bool success = 2;
  string transaction_hash = 3;
  uint64 block_number = 4;
  string error_message = 5;
}

service Iso27001ismssecuritypolicyService {
  rpc Execute(Iso27001ismssecuritypolicyRequest) returns (Iso27001ismssecuritypolicyResponse);
}
